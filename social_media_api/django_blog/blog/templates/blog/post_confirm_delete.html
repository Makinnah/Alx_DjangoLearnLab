{% extends "blog/base.html" %}
{% block content %}
  <h1>Confirm Delete</h1>
  <p>Are you sure you want to delete "{{ post.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes — Delete</button>
    <a href="{{ post.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
